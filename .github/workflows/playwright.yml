name: Playwright E2E

on:
  push:
    branches: [main, Playwright1, Playwright2]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-blogspot:
    name: Blogspot E2E (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Exclude Expand/agent suites — they need ExpandTesting base URL (separate job).
      # workers=1 reduces Blogspot empty-page / 429 flakes under GitHub Actions IPs.
      - name: Run Blogspot Playwright tests (chromium)
        run: npx playwright test --project=chromium --workers=1 --grep-invert "@expand|@agents|@catalog|Agent seed"
        env:
          CI: true
          BASE_URL: https://testautomationpractice.blogspot.com

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-blogspot
          path: playwright-report/
          retention-days: 14

      - name: Upload traces / screenshots / video
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-blogspot
          path: test-results/
          retention-days: 7

  e2e-expand:
    name: ExpandTesting smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Highlighted + agent sample only — not the full 74-page @catalog deep run
      - name: Run ExpandTesting smoke / agent sample
        run: npx playwright test --project=chromium --workers=1 --grep "@expand|@agents" --grep-invert "@catalog"
        env:
          CI: true
          BASE_URL: https://practice.expandtesting.com
          EXPAND_BASE_URL: https://practice.expandtesting.com

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-expand
          path: playwright-report/
          retention-days: 14

      - name: Upload traces / screenshots / video
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-expand
          path: test-results/
          retention-days: 7

  release-gate:
    name: Release gate (smoke)
    runs-on: ubuntu-latest
    needs: [e2e-blogspot, e2e-expand]
    # Only on main after merge — avoid long duplicate installs on every Playwright* push/PR
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke / release-tagged journey
        run: npx playwright test --project=chromium --grep @release --workers=1
        env:
          CI: true
          BASE_URL: https://testautomationpractice.blogspot.com
