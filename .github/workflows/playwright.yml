name: Playwright E2E

on:
  push:
    branches: [main, Playwright1]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: E2E (chromium parallel)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests (chromium)
        run: npx playwright test --project=chromium
        env:
          CI: true
          BASE_URL: https://testautomationpractice.blogspot.com

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload traces / screenshots / video
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  release-gate:
    name: Release gate (smoke)
    runs-on: ubuntu-latest
    needs: e2e
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/Playwright')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Smoke / release-tagged journey
        run: npx playwright test --project=chromium --grep @release
        env:
          CI: true
